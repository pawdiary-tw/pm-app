name: 推播提醒

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'morning＝今日摘要，weekly＝週報提醒'
        required: true
        default: morning
        type: choice
        options: [morning, weekly]
      force:
        description: '今天已經發過也再發一次（測試用）'
        required: false
        default: true
        type: boolean
  schedule:
    # GitHub 的時間是 UTC，台灣時間要 +8 小時。
    # GitHub 排程可能晚到 1 小時以上，所以提早排，並多排幾次補發（當天已送出就會自動略過）。
    - cron: '37 23 * * *'  # 台灣 07:37 今日摘要
    - cron: '7 0 * * *'    # 台灣 08:07 補發
    - cron: '37 0 * * *'   # 台灣 08:37 補發
    - cron: '37 10 * * 0'  # 台灣週日 18:37 週報提醒
    - cron: '7 11 * * 0'   # 台灣週日 19:07 補發
    - cron: '37 11 * * 0'  # 台灣週日 19:37 補發

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝 Firebase
        run: npm install --no-save --prefix scripts firebase-admin@12
      - name: 發送通知
        run: node scripts/remind.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KIND: ${{ github.event.inputs.kind || (endsWith(github.event.schedule, '* * 0') && 'weekly' || 'morning') }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
      - name: 保持排程啟用（公開專案 60 天沒更新，GitHub 會自動停用排程）
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "保持排程啟用"
            git push
          fi
